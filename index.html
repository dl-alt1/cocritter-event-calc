<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Critter Event Value Calculator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root{--void:#150E29;--panel:#221741;--pin:#7FD4F0;--cream:#F0EAFF;
  --dim:#8B7BB8;--line:#3A2C68;--accent:#F2A93B;--good:#6FD98F;--bad:#FF7A6B}
*{box-sizing:border-box}
body{margin:0;background:var(--void);color:var(--cream);
  font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px;line-height:1.45;
  -webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:20px 14px 60px}
h1{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;
  font-size:clamp(23px,6.6vw,34px);line-height:1.02;margin:0 0 6px;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--accent)}
.sub{color:var(--dim);font-size:12px;margin:0 0 18px}
h2{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:12px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:24px 0 9px}
h2 .sub2{font-family:'IBM Plex Mono',monospace;font-weight:400;letter-spacing:0;
  text-transform:none;opacity:.7;margin-left:6px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tab{flex:1 1 auto;min-width:84px;background:var(--panel);border:1px solid var(--line);
  color:var(--dim);border-radius:10px;padding:11px 8px;
  font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:13.5px;
  cursor:pointer;transition:.15s;line-height:1.15}
.tab:hover{color:var(--cream)}
.tab[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:var(--void)}
.tab small{display:block;font-family:'IBM Plex Mono',monospace;font-weight:400;font-size:9.5px;
  letter-spacing:.04em;opacity:.75;margin-top:3px;white-space:nowrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.swatch{width:12px;height:12px;border-radius:3px;flex:none}
.name{flex:1;min-width:0}
.name b{font-weight:500;display:block}
.name small{color:var(--dim);font-size:10.5px;display:block;line-height:1.3}
input[type=number]{width:96px;flex:none;background:var(--void);color:var(--cream);
  border:1px solid var(--line);border-radius:7px;padding:7px 8px;font-family:inherit;
  font-size:13px;font-variant-numeric:tabular-nums;text-align:right}
input[type=number]:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.locked{width:96px;flex:none;text-align:right;color:var(--dim);padding:7px 9px}
.chain{margin-top:9px;padding:11px 12px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;font-size:11.5px;color:var(--dim);display:block;line-height:1.7}
.chain b{color:var(--cream);font-weight:500;font-variant-numeric:tabular-nums}
.chain u{text-decoration:none;color:var(--accent)}
.chain .warn{color:var(--bad)}
.reads{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.read{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.read span{display:block;color:var(--dim);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.read b{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:20px;
  display:block;margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
thead th{position:sticky;top:0;background:var(--void);z-index:2;font-weight:500;font-size:9.5px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--dim);text-align:right;
  padding:8px 4px 7px;border-bottom:1px solid var(--line)}
thead th:first-child{text-align:left;padding-left:26px}
tbody td{padding:6px 4px;text-align:right;border-bottom:1px solid rgba(58,44,104,.5);font-size:12.5px}
tbody td:first-child{text-align:left;position:relative;padding-left:26px;color:var(--dim)}
tbody tr.tier{cursor:pointer}
tbody tr.tier:hover td{background:rgba(242,169,59,.06)}
tbody td.heat{font-weight:500;border-radius:3px}
tbody tr.here{box-shadow:inset 2px 0 0 var(--pin)}
tbody tr.here td:first-child{color:var(--pin)}
tbody tr.here td:first-child::after{content:'you';position:absolute;right:2px;top:50%;
  transform:translateY(-50%);font-size:8.5px;letter-spacing:.08em;color:var(--pin)}
tbody tr.past td{opacity:.45}
tbody tr.det td{padding:0;border-bottom:1px solid rgba(58,44,104,.5)}
.detbox{padding:9px 12px 11px 26px;font-size:11.5px;color:var(--dim);
  background:rgba(21,14,41,.55);text-align:left;line-height:1.65}
.detbox b{color:var(--cream);font-weight:500}
.detbox .lbl{display:inline-block;min-width:74px;color:var(--dim);opacity:.8}
.node{position:absolute;left:6px;top:50%;transform:translateY(-50%);width:9px;height:9px;
  border-radius:50%;background:var(--line);border:2px solid var(--void)}
.caret{position:absolute;left:4px;top:50%;transform:translateY(-50%);width:13px;
  text-align:center;color:var(--dim);font-size:9px;transition:.15s}
tbody tr.tier.open .caret{transform:translateY(-50%) rotate(90deg);color:var(--accent)}
.railline{position:absolute;left:10px;top:0;bottom:0;width:1px;background:var(--line)}
.tbl{position:relative}
.legend{display:grid;grid-template-columns:auto 1fr auto auto;gap:6px 8px;align-items:center;
  margin-top:12px;font-size:10px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.legend i{height:7px;border-radius:4px;display:block}
.legend span:nth-child(3),.legend span:nth-child(4){font-variant-numeric:tabular-nums;
  text-transform:none;letter-spacing:0}
.legend span:nth-child(4){color:var(--cream)}
.foot{color:var(--dim);font-size:11px;margin-top:14px;line-height:1.5}
.foot b{color:var(--cream);font-weight:500}
.note{color:var(--dim);font-size:10.5px;line-height:1.55;margin:9px 0 0;padding:9px 11px;
  border-left:2px solid var(--line)}
button.reset{background:none;border:1px solid var(--line);color:var(--dim);border-radius:7px;
  padding:6px 11px;font-family:inherit;font-size:11px;cursor:pointer;margin-top:12px}
button.reset:hover{border-color:var(--accent);color:var(--accent)}

.seg{display:flex;flex:none;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.segb{background:var(--void);border:0;color:var(--dim);padding:7px 13px;
  font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:11.5px;
  cursor:pointer;transition:.15s}
.segb+.segb{border-left:1px solid var(--line)}
.segb:hover{color:var(--cream)}
.segb.on{background:var(--accent);color:var(--void)}
.budget{font-size:10.5px;color:var(--dim);padding:0 0 10px;line-height:1.5}
.budget b{color:var(--cream);font-weight:500}
.budget b.warn{color:var(--bad)}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:2px 0 10px}
.preset{background:var(--void);border:1px solid var(--line);color:var(--dim);border-radius:9px;
  padding:8px 4px;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:12px;
  cursor:pointer;line-height:1.2;transition:.15s}
.preset:hover{color:var(--cream);border-color:var(--dim)}
.preset.on{background:var(--accent);border-color:var(--accent);color:var(--void)}
.preset small{display:block;font-family:'IBM Plex Mono',monospace;font-weight:400;
  font-size:9px;opacity:.75;margin-top:2px}
.sel{width:96px;flex:none;background:var(--void);color:var(--cream);
  border:1px solid var(--line);border-radius:7px;padding:7px 8px;font-family:inherit;
  font-size:13px;text-align:right;cursor:pointer}
.sel:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini{background:var(--void);border:1px solid var(--line);border-radius:9px;padding:8px 9px}
.mini label{display:block;color:var(--dim);font-size:10px;letter-spacing:.06em;
  text-transform:uppercase;margin-bottom:4px}
.mini input{width:100%}
.pair{border:1px solid var(--line);border-radius:12px;background:var(--panel);
  margin-bottom:8px;overflow:hidden}
.pairhd{display:flex;align-items:center;gap:9px;padding:11px 12px;cursor:pointer}
.pairhd .ttl{flex:1;font-weight:500}
.pairhd .ttl small{display:block;color:var(--dim);font-size:10.5px;font-weight:400}
.pairhd .val{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:500}
.pairhd .car{color:var(--dim);font-size:10px;transition:.15s}
.pair.open .pairhd .car{transform:rotate(90deg);color:var(--accent)}
.pairbody{display:none;padding:0 12px 12px;font-size:11.5px;color:var(--dim);line-height:1.7}
.pair.open .pairbody{display:block}
.stg{display:flex;gap:8px;padding:4px 0;border-top:1px solid rgba(58,44,104,.5)}
.stg .n{width:58px;color:var(--dim)}
.stg .r{flex:1;color:var(--cream)}
.stg .c{font-variant-numeric:tabular-nums}
.stg.miss{opacity:.38}
[hidden]{display:none !important}
</style>

<div class="wrap">
<h1>Event value <em>calculator</em></h1>
<p class="sub">Price the rewards once, then see what each event pays back.</p>

<h2>Reward values <span class="sub2">shared by every event</span></h2>
<div class="card" id="inputs"></div>

<h2>Event</h2>
<div class="tabs" role="tablist"></div>

<div id="rankwrap">
<h2>Team ranking reward</h2>
<div class="card" id="rankcard"></div>
</div>

<h2>Spend</h2>
<div class="card" id="spend"></div>
<div class="chain" id="chain"></div>
<p class="note" id="note" hidden></p>

<div class="reads" id="reads"></div>

<div id="ladder">
  <h2>Breakpoints <span class="sub2">tap a row</span></h2>
  <div class="tbl">
    <table>
      <thead><tr><th>Reach</th><th id="hC">Need</th><th id="hA">Reward</th><th>Cumul.</th><th id="hB">Rate</th></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>
  <div class="legend"><span id="lgA">Value</span><i id="ramp1"></i>
    <span id="ramp1lo"></span><span id="ramp1hi"></span></div>
  <div class="legend"><span id="lgB">Rate</span><i id="ramp2"></i>
    <span id="ramp2lo"></span><span id="ramp2hi"></span></div>
  <p class="foot" id="foot"></p>
</div>

<div id="pairs" hidden>
  <h2>Pairs <span class="sub2">tap to expand</span></h2>
  <div id="pairlist"></div>
  <p class="foot" id="pairfoot"></p>
</div>

<button class="reset" id="reset">Reset</button>
</div>

const LUCK=[[0,8e5,'r1'],[8e5,2.2e6,'r2'],[2.2e6,5.6e6,'r3'],[5.6e6,Infinity,'r4']];
function rodsFor(e,target){
  let rods=0;
  for(const [lo,hi,k] of LUCK){
    const span=Math.max(0,Math.min(target,hi)-lo);
    if(span<=0)continue;
    const rate=e[k]||0;
    if(!rate)return Infinity;
    rods+=span/rate;
  }
  return rods;
}
function pointsFromRods(e,rods){
  let pts=0,left=rods;
  for(const [lo,hi,k] of LUCK){
    const rate=e[k]||0;
    if(!rate)break;
    const cap=(hi-lo)/rate;                 // rods to cross this band
    if(left<=cap)return pts+left*rate;
    left-=cap;pts=hi;
  }
  return pts;
}

const KG=5, CRIT=1.25, HOURS=72;
function grow(e){
  const fert=e.spent*e.perPin, m=(e.speed||0)/100, a=(e.avg||0)/100;
  const rate=KG*(1+m)*(e.crits?CRIT:1);      // feeding, at max speed
  const natural=3*(1+a)*HOURS;               // 3 kg/hr for 72 h, at average speed
  const fed=fert*rate;
  return {fert:fert,rate:rate,fed:fed,natural:natural,
          total:fed+natural,mult:1+m,amult:1+a};
}
function pointsOf(e){
  if(e.id==='fert')return grow(e).total;
  if(e.id==='rods')return pointsFromRods(e,e.spent*e.perPin);
  const own=e.spent*e.perPin*e.ptsPer*(e.id==='zobo'?1e-4:e.id==='mara'?1e3:1);
  const pct=Math.max(0.0001,(e.pct||100)/100);
  return (e.id==='zobo'||e.id==='mara')?own/pct:own;
}
function currencyFor(e,target){
  if(e.id==='fert'){const g=grow(e);return g.rate?Math.max(0,(target-g.natural)/g.rate):0;}
  if(e.id==='rods')return rodsFor(e,target);
  if(e.id==='zobo'||e.id==='mara'){
    const pct=Math.max(0.0001,(e.pct||100)/100);
    const per=e.ptsPer*(e.id==='zobo'?1e-4:e.id==='mara'?1e3:1);
    return per?target*pct/per:0;}
  return e.ptsPer?target/e.ptsPer:0;
}
const bagValue=b=>RES.reduce((a,r)=>a+(b[r.k]||0)*(VALS[r.k]||0),0);
const bagText=b=>{
  const p=[];
  RES.forEach(r=>{if(b[r.k])p.push(fmt(b[r.k])+' '+r.n.toLowerCase()+(b[r.k]>1&&r.k!=='pin'?(r.k==='box'?'es':'s'):''));});
  return p.length?p.join(' + '):'nothing';
};

function summarise(e){
  if(e.kind==='stages'){
    const total={};let sum=0;
    e.you.forEach((v,i)=>{
      const tot=v+(e.mate[i]||0), bag={};
      e.S.forEach(st=>{if(tot>=st[0])for(const k in st[1])bag[k]=(bag[k]||0)+st[1][k];});
      sum+=bagValue(bag);
      for(const k in bag)total[k]=(total[k]||0)+bag[k];
    });
    const keys=total.key||0, kbag={};
    KEYREWARDS.forEach(([need,rw])=>{if(keys>=need)for(const k in rw)kbag[k]=(kbag[k]||0)+rw[k];});
    const cost=e.you.reduce((a,b)=>a+b,0)/(e.perPin||1);
    return {value:sum+bagValue(kbag),cost:cost};
  }
  const worth=t=>RES.reduce((a,r)=>a+(t[r.i]||0)*(VALS[r.k]||0),0);
  const pts=pointsOf(e);
  let cum=0;
  e.T.forEach(t=>{if(t[0]<=pts)cum+=worth(t);});
  return {value:cum+bagValue(rankBag(e.rank)),cost:e.spent};
}
function roiOf(e){
  const {value,cost}=summarise(e);
  return cost>0?(value-cost)/cost*100:0;
}

function mix(t,st){t=Math.max(0,Math.min(1,t));
  for(let i=1;i<st.length;i++){if(t<=st[i][0]||i===st.length-1){
    const a=st[i-1],b=st[i],f=Math.max(0,Math.min(1,(t-a[0])/((b[0]-a[0])||1)));
    return a[1].map((c,j)=>Math.round(c+(b[1][j]-c)*f));}}}

  const mine=e.you.reduce((a,b)=>a+b,0);
  const left=pick-mine;
  document.getElementById('chain').innerHTML=
    '<b>'+fmt(e.spent)+'</b> pinballs <u>&rarr;</u> <b>'+fmt(pick)+'</b> pickaxes<br>'+
    'allocated <b>'+fmt(mine)+'</b> across your four players &mdash; '+
    (Math.abs(left)<0.5?'<b>fully spent</b>':
      left>0?'<b>'+fmt(left)+'</b> unallocated':
      '<span class="warn">'+fmt(-left)+' over budget</span>');

  const pairs=e.you.map((v,i)=>{
    const tot=v+e.mate[i];
    const bag={},got=[];
    e.S.forEach((st,si)=>{
      const hit=tot>=st[0];
      if(hit)for(const k in st[1])bag[k]=(bag[k]||0)+st[1][k];
      got.push({i:si+1,need:st[0],rw:st[1],hit:hit});
    });
    return {i:i+1,you:v,mate:e.mate[i],tot:tot,bag:bag,got:got,
            val:bagValue(bag),stages:got.filter(g=>g.hit).length};
  });
  const total={};
  pairs.forEach(p=>{for(const k in p.bag)total[k]=(total[k]||0)+p.bag[k];});
  const keys=total.key||0;
  const kbag={},khit=[];
  KEYREWARDS.forEach(([need,rw])=>{
    const hit=keys>=need;
    if(hit)for(const k in rw)kbag[k]=(kbag[k]||0)+rw[k];
    khit.push({need:need,rw:rw,hit:hit});
  });
  for(const k in kbag)total[k]=(total[k]||0)+kbag[k];
  const sum=pairs.reduce((a,p)=>a+p.val,0)+bagValue(kbag);

  setReads([
    ['Pickaxes',fmt(pick)],
    ['Stages cleared',pairs.reduce((a,p)=>a+p.stages,0)+' / '+(4*e.S.length)],
    ['Keys',keys+' / 16'],
    ['Key rewards',fmt(bagValue(kbag))],
    ['Total value',fmt(sum)],
    ['Net vs spend',(sum-e.spent>=0?'+':'\u2212')+fmt(Math.abs(sum-e.spent)),
      sum-e.spent>=0?'var(--good)':'var(--bad)']
  ]);

  const list=document.getElementById('pairlist');list.innerHTML='';
  pairs.forEach(p=>{
    const box=document.createElement('div');
    box.className='pair'+(open.has('p'+p.i)?' open':'');
    const next=p.got.find(g=>!g.hit);
    box.innerHTML=
      '<div class="pairhd"><span class="car">&#9656;</span>'+
      '<span class="ttl">Pair '+p.i+' &middot; '+fmt(p.tot)+' pickaxes'+
      '<small>you '+fmt(p.you)+' + partner '+fmt(p.mate)+' &middot; stage '+p.stages+'/'+e.S.length+
      (next?' &middot; next at '+fmt(next.need):' &middot; complete')+'</small></span>'+
      '<span class="val">'+fmt(p.val)+'</span></div>'+
      '<div class="pairbody"><div style="padding:6px 0 2px">Cumulative: <b style="color:var(--cream)">'+
      bagText(p.bag)+'</b></div>'+
      p.got.map(g=>'<div class="stg'+(g.hit?'':' miss')+'"><span class="n">Stage '+g.i+
        '</span><span class="r">'+bagText(g.rw)+'</span><span class="c">'+fmt(g.need)+'</span></div>').join('')+
      '</div>';
    box.querySelector('.pairhd').addEventListener('click',function(){
      const k='p'+p.i;
      if(open.has(k))open.delete(k);else open.add(k);
      box.classList.toggle('open');
    });
    list.appendChild(box);
  });
  const kb=document.createElement('div');
  kb.className='pair'+(open.has('keys')?' open':'');
  const nk=khit.find(x=>!x.hit);
  kb.innerHTML='<div class="pairhd"><span class="car">&#9656;</span>'+
    '<span class="ttl">Key rewards &middot; '+keys+' keys'+
    '<small>'+khit.filter(x=>x.hit).length+'/4 milestones'+
    (nk?' &middot; next at '+nk.need+' keys':' &middot; all claimed')+'</small></span>'+
    '<span class="val">'+fmt(bagValue(kbag))+'</span></div>'+
    '<div class="pairbody"><div style="padding:6px 0 2px">Cumulative: <b style="color:var(--cream)">'+
    bagText(kbag)+'</b></div>'+
    khit.map(x=>'<div class="stg'+(x.hit?'':' miss')+'"><span class="n">'+x.need+
      ' keys</span><span class="r">'+bagText(x.rw)+'</span><span class="c"></span></div>').join('')+
    '</div>';
  kb.querySelector('.pairhd').addEventListener('click',function(){
    if(open.has('keys'))open.delete('keys');else open.add('keys');
    kb.classList.toggle('open');
  });
  list.appendChild(kb);

  document.getElementById('pairfoot').innerHTML=
    'All four pairs together: <b>'+bagText(total)+'</b> &mdash; worth <b>'+fmt(sum)+
    '</b> against <b>'+fmt(e.spent)+'</b> pinballs spent. '+
    'A pair only counts its own combined pickaxes, so an uneven split wastes stages.';
}

function renderLadder(){
  const e=E(), W=e.W;
  const worth=t=>RES.reduce((s,r)=>s+(t[r.i]||0)*(VALS[r.k]||0),0);
  const bagOf=t=>{const b={};RES.forEach(r=>{if(t[r.i])b[r.k]=t[r.i];});return b;};
  const pts=pointsOf(e);

  if(e.id==='fert'){
    const g=grow(e);
    document.getElementById('chain').innerHTML=
      '<b>'+fmt(e.spent)+'</b> pinballs <u>&rarr;</u> <b>'+fmt(g.fert)+'</b> fertilizer<br>'+
      'fed at <b>'+g.mult.toFixed(2)+'&times;</b> max speed: <b>'+sig(g.rate*10)+'</b> kg per 10 fertilizer'+
      (e.crits?' (crit-adjusted)':'')+'<br>'+
      '<b>'+fmt(g.fed)+'</b> kg fed + <b>'+fmt(g.natural)+'</b> kg grown over 72h at <b>'+g.amult.toFixed(2)+'&times;</b> average<br>'+
      '<u>&rarr;</u> <b>'+fmt(pts)+'</b> kg = <b>'+fmt(pts)+'</b> points';
  }else if(e.id==='zobo'||e.id==='mara'){
    const mid=e.spent*e.perPin, own=mid*e.ptsPer*(e.id==='zobo'?1e-4:e.id==='mara'?1e3:1), pc=e.pct||100;
    document.getElementById('chain').innerHTML=
      '<b>'+fmt(e.spent)+'</b> pinballs <u>&rarr;</u> <b>'+fmt(mid)+'</b> '+e.units+' <u>&rarr;</u> '+
      '<b>'+(e.id==='mara'?dist(own):fmt(own))+'</b> of your own<br>'+
      'at <b>'+sig(pc)+'%</b> of the team <u>&rarr;</u> <b>'+
      (e.id==='mara'?dist(pts):fmt(pts))+'</b> team total';
  }else if(e.id==='rods'){
    const rods=e.spent*e.perPin;
    let left=rods,parts=[];
    for(const [lo,hi,k] of LUCK){
      const rate=e[k]||0;if(!rate||left<=0)break;
      const cap=(hi-lo)/rate, used=Math.min(left,cap);
      parts.push('<b>'+fmt(used)+'</b> at '+fmt(rate));left-=used;
      if(left<=0)break;
    }
    document.getElementById('chain').innerHTML=
      '<b>'+fmt(e.spent)+'</b> pinballs <u>&rarr;</u> <b>'+sig(rods)+'</b> rods<br>'+
      'spent as '+parts.join(' <u>+</u> ')+' points per rod<br>'+
      '<u>&rarr;</u> <b>'+fmt(pts)+'</b> points';
  }else{
    document.getElementById('chain').innerHTML=
      '<b>'+fmt(e.spent)+'</b> pinballs <u>&rarr;</u> <b>'+sig(e.spent*e.perPin)+'</b> '+e.units+
      ' <u>&rarr;</u> <b>'+fmt(pts)+'</b> points';
  }

  const maxPt=e.T[e.T.length-1][0];
  const rows=[];
  if(e.mode==='tiers'){
    let cum=0,prev=0;
    e.T.forEach(t=>{const v=worth(t);cum+=v;
      rows.push({hi:t[0],lo:prev,v:v,cum:cum,avg:t[0]?cum/t[0]*1000:0,bag:bagOf(t)});prev=t[0];});
    document.getElementById('hA').textContent='This tier';
    document.getElementById('hB').textContent='Cumul./1K';
  }else{
    const N=Math.ceil(maxPt/W);let cum=0;
    for(let i=1;i<=N;i++){
      const hi=i*W,lo=hi-W,sel=e.T.filter(t=>t[0]>lo&&t[0]<=hi);
      const v=sel.reduce((s,t)=>s+worth(t),0);cum+=v;
      const b={};sel.forEach(t=>RES.forEach(r=>{if(t[r.i])b[r.k]=(b[r.k]||0)+t[r.i];}));
      rows.push({hi:hi,lo:lo,v:v,cum:cum,avg:cum/i,bag:b});
    }
    document.getElementById('hA').textContent='This 500K';
    document.getElementById('hB').textContent='Avg/500K';
  }
  document.getElementById('hC').textContent=
    e.id==='zobo'?'Your coins':e.id==='mara'?'Your skates':e.id==='fert'?'Fertilizer':'Rods';

  const spendFor=target=>currencyFor(e,target);
  const done=rows.filter(r=>r.hi<=pts);
  const ladder=done.length?done[done.length-1].cum:0;
  const rbag=rankBag(e.rank), rval=bagValue(rbag);
  const earned=ladder+rval;
  const net=earned-e.spent;
  const best=rows.reduce((a,b)=>b.avg>a.avg?b:a);
  const total=rows[rows.length-1].cum;

  setReads([
    ['Earned so far',fmt(earned)],
    ['Rank bonus','#'+e.rank+' \u00b7 '+fmt(rval)],
    ['Net vs spend',(net>=0?'+':'\u2212')+fmt(Math.abs(net)),net>=0?'var(--good)':'var(--bad)'],
    ['Best stop',tierLabel(e,best.hi)],
    ['Spend for best',fmt(spendFor(best.hi)/(e.perPin||1))+' pb']
  ]);

  const vs=rows.map(r=>r.v),as=rows.map(r=>r.avg);
  const vlo=Math.min.apply(null,vs),vhi=Math.max.apply(null,vs);
  const alo=Math.min.apply(null,as),ahi=Math.max.apply(null,as);
  const ln=v=>Math.sqrt((v-vlo)/((vhi-vlo)||1));
  const an=v=>(v-alo)/((ahi-alo)||1);

  const tb=document.getElementById('body');tb.innerHTML='';
  const run={};
  rows.forEach((r,idx)=>{
    for(const k in r.bag)run[k]=(run[k]||0)+r.bag[k];
    const snap=Object.assign({},run);
    const key=e.id+':'+r.hi;
    const tr=document.createElement('tr');
    tr.className='tier'+(open.has(key)?' open':'');
    if(pts>r.lo&&pts<=r.hi)tr.className+=' here';
    else if(r.hi<pts)tr.className+=' past';
    const t1=ln(r.v),t2=an(r.avg),c1=mix(t1,HEAT),c2=mix(t2,AVG);
    tr.innerHTML='<td><span class="caret">&#9656;</span>'+tierLabel(e,r.hi)+'</td>'+
      '<td style="color:var(--dim);font-size:11.5px">'+fmt(spendFor(r.hi))+'</td>'+
      '<td class="heat" style="background:'+rgba(c1,.16+t1*.5)+';color:'+(t1>.6?'#150E29':'var(--cream)')+'">'+fmt(r.v)+'</td>'+
      '<td>'+fmt(r.cum)+'</td>'+
      '<td class="heat" style="background:'+rgba(c2,.12+t2*.42)+';color:'+(t2>.72?'#150E29':'var(--cream)')+'">'+fmt(r.avg)+'</td>';
    const det=document.createElement('tr');det.className='det';det.hidden=!open.has(key);
    det.innerHTML='<td colspan="5"><div class="detbox">'+
      '<div><span class="lbl">This step</span><b>'+bagText(r.bag)+'</b></div>'+
      '<div><span class="lbl">Cumulative</span><b>'+bagText(snap)+'</b></div></div></td>';
    tr.addEventListener('click',function(){
      if(open.has(key))open.delete(key);else open.add(key);
      tr.classList.toggle('open');det.hidden=!det.hidden;
    });
    tb.appendChild(tr);tb.appendChild(det);
  });
  document.querySelectorAll('.railline').forEach(x=>x.remove());
  const rail=document.createElement('div');rail.className='railline';
  document.querySelector('.tbl').appendChild(rail);

  const bar=st=>'linear-gradient(90deg,'+st.map(x=>'rgb('+mix(x[0],st).join(',')+') '+(x[0]*100)+'%').join(',')+')';
  document.getElementById('ramp1').style.background=bar(HEAT);
  document.getElementById('ramp2').style.background=bar(AVG);
  document.getElementById('lgA').textContent=e.mode==='tiers'?'Value of that tier':'Value in that 500K';
  document.getElementById('lgB').textContent=e.mode==='tiers'?'Cumulative per 1K':'Running average';
  document.getElementById('ramp1lo').textContent=fmt(vlo);
  document.getElementById('ramp1hi').textContent=fmt(vhi);
  document.getElementById('ramp2lo').textContent=fmt(alo);
  document.getElementById('ramp2hi').textContent=fmt(ahi);

  const fullCost=spendFor(maxPt);
  document.getElementById('foot').innerHTML=
    'Peak running average sits at <b>'+tierLabel(e,best.hi)+'</b> ('+fmt(best.avg)+'), needing <b>'+
    fmt(spendFor(best.hi)/(e.perPin||1))+'</b> pinballs. Finishing all '+tierLabel(e,maxPt)+
    ' costs <b>'+fmt(fullCost/(e.perPin||1))+'</b> pinballs and returns '+fmt(total)+' &mdash; '+
    (total>=fullCost/(e.perPin||1)
      ? 'a net gain of <b>'+fmt(total-fullCost/(e.perPin||1))+'</b>.'
      : 'a net loss of <b>'+fmt(fullCost/(e.perPin||1)-total)+'</b>.');
}

const NOTES={
 rods:'Points per rod rise with base luck as you climb, so the rod column accounts for crossing each band rather than applying one flat rate.',
 zobo:'Tiers are team totals. Your own coins are scaled up by your contribution share, so a lower share means the team reaches further than you paid for.',
 mara:'Tiers are team totals and scale by your contribution share. Chests give one pick, resolved as wishbox &gt; pinball &gt; capsule &gt; skate, so skates and blue bento are never taken. Candy is excluded, and the 8.5&ndash;9.5km tiers are estimates.',
 hunt:'Keys are not priced directly &mdash; they pay out through the 4/8/12/16 milestones. Each pair only counts its own combined pickaxes, and stage thresholds are cumulative, so a pair at 1,199 has cleared four stages rather than five.',
 fert:'Feeding uses max growth speed &mdash; 10 fertilizer gives 50 kg, scaled by it, and by the 1.25&times; crit average when crits are on. Natural growth runs at average speed over a fixed 72 h, and its kg are free, so they are netted off the fertilizer column.',
};
function render(){
  const e=E();
  const nt=document.getElementById('note');
  nt.hidden=!NOTES[e.id];
  if(NOTES[e.id])nt.innerHTML=NOTES[e.id];
  const stages=e.kind==='stages';
  document.getElementById('ladder').hidden=stages;
  document.getElementById('pairs').hidden=!stages;
  if(stages)renderStages();else renderLadder();
  paintTabs();
}

const tabs=document.querySelector('.tabs');
EV.forEach((e,i)=>{
  const b=document.createElement('button');
  b.className='tab';b.setAttribute('role','tab');
  b.setAttribute('aria-selected',i===0);b.innerHTML=e.label;
  b.addEventListener('click',function(){
    cur=i;
    tabs.querySelectorAll('.tab').forEach((x,j)=>x.setAttribute('aria-selected',j===i));
    buildInputs();render();
  });
  tabs.appendChild(b);
});
document.getElementById('reset').addEventListener('click',function(){
  const d=DEF[cur],e=E();
  Object.keys(d).forEach(k=>{if(d[k]!==undefined)e[k]=JSON.parse(JSON.stringify(d[k]));});
  Object.assign(VALS,DEFVALS);
  buildInputs();render();
});
buildInputs();render();
</script>
